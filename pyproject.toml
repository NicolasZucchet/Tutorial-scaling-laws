[project]
name = "assocmem"
version = "1.0.0"
description = "Scaling-law tutorial: build the best linear-softmax associative memory under a flop budget"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.35",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel", "nbclient"]
slides = ["colloquium>=0.2.3"]

# installed by `uv run`/`uv sync` but not by `pip install .`, so a Colab install stays
# to the four numeric dependencies and leaves the preinstalled CUDA jax alone
[dependency-groups]
dev = ["colloquium>=0.2.3"]

[project.scripts]
assocmem-prepare = "assocmem.prepare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assocmem"]

[tool.uv]
package = true
